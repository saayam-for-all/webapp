name: CI/CD

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint check
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build application
        run: npm run build

      - name: Smoke test
        run: |
          npm run dev &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            echo "Checking application availability (attempt $i/20)"
            if curl --fail --silent http://localhost:5173 > /dev/null; then
              echo "Application smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Application did not respond on port 5173"
          exit 1

      - name: Dependency vulnerability audit
        id: audit
        continue-on-error: true
        run: npm audit --json > npm-audit-report.json

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn

      - name: Report existing quality issues
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "ESLint outcome: $LINT_OUTCOME"
          echo "Dependency audit outcome: $AUDIT_OUTCOME"
          echo "Existing findings are temporarily non-blocking."
